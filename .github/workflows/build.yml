name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.HOTEL_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Release signing key (optional)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.HOTEL_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hotel.jks" && echo "HOTEL_STORE_FILE=$RUNNER_TEMP/hotel.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          HOTEL_STORE_PASSWORD: ${{ secrets.HOTEL_STORE_PASSWORD }}
          HOTEL_KEY_ALIAS: ${{ secrets.HOTEL_KEY_ALIAS }}
          HOTEL_KEY_PASSWORD: ${{ secrets.HOTEL_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: hotel-launcher-apk
          path: android/app/build/outputs/apk/**/*.apk
