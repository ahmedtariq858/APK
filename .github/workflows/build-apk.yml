name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: IR-Universal-Remote-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Manual runs ("Run workflow") also commit the release APK into the repo under apk/.
      - name: Commit APK to repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/IR-Universal-Remote.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/IR-Universal-Remote.apk
          git commit -m "Add built APK [skip ci]" || echo "No changes"
          git push
