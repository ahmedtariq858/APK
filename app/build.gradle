plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lostrelic.infinitechase'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lostrelic.infinitechase'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideload).
            // For Play Store, replace with your own release signingConfig.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
